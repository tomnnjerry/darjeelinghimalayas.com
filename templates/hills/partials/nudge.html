<aside class="nudge" data-nudge hidden aria-label="Planning help"{% if nudge_slug %} data-land="{{ nudge_slug }}"{% endif %}>
  <button type="button" class="nudge__x" data-nudge-close aria-label="Close">×</button>
  <b>Want this as a priced plan for your dates?</b>
  <p>A local planner turns it into a route with every rupee listed. No payment to start.</p>
  <a class="btn btn--foil btn--sm" href="{% url 'plan' %}?from={{ request.path|urlencode }}{% if nudge_slug %}&land={{ nudge_slug }}{% endif %}" data-cta="nudge-plan">Get my honest quote</a>
</aside>
