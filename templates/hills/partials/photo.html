{% load hills %}<figure class="photo {{ cls }}">
  <div class="photo__frame {{ ratio }}{% if not img %} photo__frame--empty{% endif %}">{% if img %}<img src="{{ img|src:960 }}" srcset="{{ img|srcset }}" sizes="{{ sizes }}" alt="{{ alt }}" {% if eager %}fetchpriority="high"{% else %}loading="lazy"{% endif %} decoding="async"{% if img.width %} width="{{ img.width }}" height="{{ img.height }}"{% endif %}>{% endif %}</div>
  {% if img and credit %}<figcaption class="photo__credit">Photo: <a href="{{ img.source }}" rel="noopener" target="_blank">{{ img|short_credit }}</a>, Wikimedia Commons</figcaption>{% endif %}
</figure>
