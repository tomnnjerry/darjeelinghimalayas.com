<div class="mbar" role="img" aria-label="Best months: {{ label|default:'see notes' }}">{% for c in bar %}<span data-v="{{ c.v }}" title="{{ c.full }}">{{ c.m }}</span>{% endfor %}</div>
<div class="mbar-key"><span><i style="background:var(--grad)"></i>Best</span><span><i style="background:color-mix(in srgb, var(--accent) 45%, var(--paper))"></i>Good</span><span><i style="background:var(--paper-2)"></i>Avoid or closed</span></div>
